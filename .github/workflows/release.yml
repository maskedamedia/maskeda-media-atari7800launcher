name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packaged app
        run: make package

      - name: Read packaged version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          APP_PLIST="dist/Atari7800Launcher.app/Contents/Info.plist"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update release tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${{ github.sha }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -d "$TAG"
          fi
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            git push origin ":refs/tags/$TAG"
          fi
          git tag "$TAG" "$SHA"
          git push origin "$TAG"

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="Atari7800Launcher $TAG"
          NOTES_FILE="$(mktemp)"
          CHANGELOG_URL="https://github.com/maskedamedia/maskeda-media-atari7800launcher/blob/main/CHANGELOG.md"
          CHANGELOG_SECTION="$(awk '
            BEGIN { capture = 0 }
            /^## / {
              if (capture == 1) exit
              capture = 1
            }
            capture == 1 { print }
          ' CHANGELOG.md)"

          {
            echo "Release $TAG"
            echo
            echo "[View full changelog]($CHANGELOG_URL)"
            echo
            if [ -n "$CHANGELOG_SECTION" ]; then
              printf '%s\n' "$CHANGELOG_SECTION"
              echo
            fi
            echo "Artifacts:"
            echo "- Atari7800Launcher.zip"
          } > "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
          fi

          gh release upload "$TAG" dist/Atari7800Launcher.zip --clobber
